[package]
name = "pressmark"
version = "1.2.5"
edition = "2021"
authors = ["Daniel Hallman"]
description = "Create and preview PDF invoices, contracts, and real estate documents in a browser or through an agent."
default-run = "pressmark"
license = "MIT"
repository = "https://github.com/mooshee/pressmark"
homepage = "https://pressmark.dev"
documentation = "https://pressmark.dev/docs"
readme = "README.md"
keywords = ["mcp", "pdf", "invoice", "real-estate", "typst"]
categories = ["command-line-utilities", "template-engine", "web-programming::http-server"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dotenvy = "0.15"

[dev-dependencies]

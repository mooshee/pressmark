[package]
name = "pressmark-deploy"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Hallman"]
publish = false

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
